<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="퇴비화 일러스트">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7D6"/><stop offset="1" stop-color="#FFE3B0"/></linearGradient>
    <linearGradient id="m-pile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A5B2A"/><stop offset="1" stop-color="#5E3517"/></linearGradient>
    <linearGradient id="m-pile2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8733A"/><stop offset="1" stop-color="#7A4520"/></linearGradient>
    <linearGradient id="m-bag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="m-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
  </defs>
  <rect width="640" height="480" rx="36" fill="url(#m-bg)"/>
  <circle cx="512" cy="96" r="46" fill="url(#m-sky)" opacity=".9"/>
  <circle cx="512" cy="96" r="66" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 10" opacity=".7"/>
  <path d="M0 330 Q160 300 320 318 T640 300 V480 H0Z" fill="#FCD38D" opacity=".6"/>
  <ellipse cx="270" cy="392" rx="230" ry="26" fill="#C98A3A" opacity=".25"/>
  <!-- tarp -->
  <path d="M60 372 L470 372 L500 392 L40 392Z" fill="#3B82F6"/>
  <path d="M60 372 L470 372 L478 378 L54 378Z" fill="#60A5FA"/>
  <!-- aeration pipe -->
  <rect x="44" y="352" width="452" height="14" rx="7" fill="#F97316"/>
  <rect x="44" y="352" width="452" height="5" rx="2.5" fill="#FDBA74"/>
  <g fill="#FFEDD5"><circle cx="110" cy="359" r="3"/><circle cx="170" cy="359" r="3"/><circle cx="230" cy="359" r="3"/><circle cx="290" cy="359" r="3"/><circle cx="350" cy="359" r="3"/><circle cx="410" cy="359" r="3"/></g>
  <!-- blower -->
  <rect x="496" y="320" width="64" height="58" rx="10" fill="#0F766E"/>
  <rect x="504" y="330" width="48" height="20" rx="5" fill="#99F6E4"/>
  <circle cx="528" cy="362" r="9" fill="#134E4A"/><path d="M528 353v18M519 362h18" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="528" y="345" font-family="Arial" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">O₂ ↑</text>
  <!-- windrow -->
  <path d="M70 360 C90 250 160 200 270 196 C380 200 440 250 470 360Z" fill="url(#m-pile)"/>
  <path d="M110 360 C130 270 190 228 270 226 C350 228 410 270 430 360Z" fill="url(#m-pile2)" opacity=".55"/>
  <g fill="#3E2210" opacity=".55"><circle cx="150" cy="300" r="4"/><circle cx="200" cy="270" r="3"/><circle cx="250" cy="250" r="4"/><circle cx="320" cy="262" r="3"/><circle cx="380" cy="300" r="4"/><circle cx="300" cy="320" r="3"/><circle cx="220" cy="330" r="4"/><circle cx="340" cy="335" r="3"/><circle cx="410" cy="330" r="3"/><circle cx="130" cy="340" r="3"/></g>
  <g fill="#E3A35E" opacity=".7"><circle cx="175" cy="285" r="3"/><circle cx="268" cy="290" r="3"/><circle cx="355" cy="285" r="3"/><circle cx="240" cy="345" r="2.5"/><circle cx="395" cy="345" r="2.5"/></g>
  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85">
    <path d="M210 186 C196 166 222 152 208 130"/>
    <path d="M270 176 C256 152 286 138 270 110"/>
    <path d="M330 186 C316 166 342 152 328 130"/>
  </g>
  <!-- thermometer -->
  <g transform="translate(352 150)">
    <rect x="0" y="0" width="22" height="120" rx="11" fill="#fff" stroke="#0B2A1F" stroke-width="3"/>
    <rect x="7" y="34" width="8" height="78" rx="4" fill="#EF4444"/>
    <circle cx="11" cy="120" r="16" fill="#EF4444" stroke="#0B2A1F" stroke-width="3"/>
    <rect x="-56" y="-6" width="50" height="28" rx="8" fill="#0B2A1F"/>
    <text x="-31" y="13" font-family="Arial" font-size="14" font-weight="700" fill="#FDE68A" text-anchor="middle">65°C</text>
  </g>
  <!-- cycle arrow to bag -->
  <path d="M440 210 C490 170 560 190 572 240" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M560 232 L574 252 L586 230" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- compost bag -->
  <g transform="translate(540 262)">
    <path d="M-34 0 H34 L42 120 H-42Z" fill="url(#m-bag)"/>
    <path d="M-34 0 H34 L30 -12 H-30Z" fill="#047857"/>
    <circle cx="0" cy="56" r="22" fill="#ECFDF5"/>
    <path d="M-10 66 C-10 50 0 42 14 42 C14 58 4 66 -10 66Z" fill="#10B981"/>
    <path d="M-10 66 L6 50" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="104" font-family="Arial" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">COMPOST</text>
  </g>
  <!-- sprouts -->
  <g transform="translate(600 392)"><path d="M0 0 V-28" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/><path d="M0 -20 C-16 -24 -20 -38 -18 -44 C-6 -40 0 -32 0 -20Z" fill="#22C55E"/><path d="M0 -26 C14 -30 20 -42 18 -50 C6 -46 0 -38 0 -26Z" fill="#4ADE80"/></g>
  <g fill="#fff"><path d="M70 120 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M420 70 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/></g>
</svg>
