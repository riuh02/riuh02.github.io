<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="장학 및 해외파견 지원 일러스트">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF5E1"/><stop offset=".6" stop-color="#E8F7FF"/><stop offset="1" stop-color="#E7FBEF"/></linearGradient>
    <radialGradient id="s-globe" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></radialGradient>
    <linearGradient id="s-coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#EAB308"/></linearGradient>
  </defs>
  <rect width="640" height="480" rx="36" fill="url(#s-bg)"/>
  <ellipse cx="320" cy="412" rx="250" ry="20" fill="#0369A1" opacity=".12"/>
  <!-- globe -->
  <g transform="translate(430 210)">
    <circle r="130" fill="url(#s-globe)"/>
    <g fill="#4ADE80"><path d="M-80 -60 C-50 -90 -10 -80 0 -50 C10 -20 -30 -10 -40 10 C-50 30 -90 10 -96 -20Z"/><path d="M20 30 C50 10 90 20 96 50 C90 90 50 100 30 80 C10 60 0 44 20 30Z"/><path d="M40 -100 C70 -96 96 -70 100 -40 C80 -40 56 -60 40 -100Z"/></g>
    <circle r="130" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>
    <ellipse rx="130" ry="44" fill="none" stroke="#fff" stroke-width="2" opacity=".4"/>
    <path d="M0 -130 C-50 -60 -50 60 0 130 M0 -130 C50 -60 50 60 0 130" fill="none" stroke="#fff" stroke-width="2" opacity=".4"/>
  </g>
  <!-- plane path -->
  <path d="M250 120 C320 40 470 30 560 90" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round"/>
  <g transform="translate(570 96) rotate(30)">
    <path d="M-30 0 L30 -4 C40 -4 40 4 30 4 L-30 0Z" fill="#fff" stroke="#0B2A1F" stroke-width="3"/>
    <path d="M0 -2 L-14 -30 H-4 L14 -2Z M0 2 L-14 30 H-4 L14 2Z" fill="#F43F5E" stroke="#0B2A1F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-28 0 L-36 -12 H-30 L-22 0Z" fill="#F43F5E" stroke="#0B2A1F" stroke-width="2"/>
  </g>
  <!-- coin stacks -->
  <g transform="translate(70 250)">
    <g fill="url(#s-coin)" stroke="#A16207" stroke-width="3">
      <ellipse cx="60" cy="140" rx="50" ry="14"/><ellipse cx="60" cy="122" rx="50" ry="14"/><ellipse cx="60" cy="104" rx="50" ry="14"/><ellipse cx="60" cy="86" rx="50" ry="14"/>
      <ellipse cx="170" cy="140" rx="50" ry="14"/><ellipse cx="170" cy="122" rx="50" ry="14"/><ellipse cx="170" cy="104" rx="50" ry="14"/><ellipse cx="170" cy="86" rx="50" ry="14"/><ellipse cx="170" cy="68" rx="50" ry="14"/><ellipse cx="170" cy="50" rx="50" ry="14"/>
    </g>
    <text x="170" y="56" font-family="Arial" font-size="18" font-weight="900" fill="#A16207" text-anchor="middle">₩</text>
    <g transform="translate(60 20)">
      <circle r="44" fill="url(#s-coin)" stroke="#A16207" stroke-width="4"/>
      <circle r="32" fill="none" stroke="#A16207" stroke-width="2" stroke-dasharray="3 5"/>
      <path d="M-14 -12 L-6 14 L0 -4 L6 14 L14 -12 M-18 0 H18" fill="none" stroke="#A16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- cap -->
  <g transform="translate(170 110)">
    <path d="M-70 -10 L0 -42 L70 -10 L0 22Z" fill="#065F46"/>
    <path d="M-40 4 V26 C-40 40 40 40 40 26 V4 L0 22Z" fill="#047857"/>
    <path d="M48 -6 V30" stroke="#FACC15" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="36" r="7" fill="#FACC15"/>
  </g>
  <g fill="#fff"><path d="M300 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M320 200 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/></g>
</svg>
