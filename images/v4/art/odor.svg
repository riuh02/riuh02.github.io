    <circle cx="14" cy="0" r="30" fill="#EDE9FE" stroke="#4C1D95" stroke-width="5"/>
    <g fill="#7C3AED"><path d="M14 0 C14 -18 24 -24 30 -20 C28 -10 22 -4 14 0Z"/><path d="M14 0 C30 6 32 18 26 24 C18 18 14 10 14 0Z"/><path d="M14 0 C2 12 -10 10 -12 2 C-2 -4 6 -4 14 0Z"/></g>
    <circle cx="14" cy="0" r="5" fill="#4C1D95"/>
