<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="바이오에너지 일러스트">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2FCE2"/><stop offset="1" stop-color="#D9F7B5"/></linearGradient>
    <linearGradient id="b-tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CBD5E1"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <linearGradient id="b-dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/></linearGradient>
    <linearGradient id="b-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A5F3FC"/></linearGradient>
    <linearGradient id="b-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF08A"/><stop offset="1" stop-color="#FACC15"/></linearGradient>
  </defs>
  <rect width="640" height="480" rx="36" fill="url(#b-bg)"/>
  <circle cx="96" cy="92" r="40" fill="url(#b-sun)"/>
  <path d="M0 356 Q170 330 330 346 T640 334 V480 H0Z" fill="#A3E635" opacity=".45"/>
  <ellipse cx="300" cy="400" rx="250" ry="22" fill="#3F6212" opacity=".16"/>
  <!-- digester 1 (big) -->
  <rect x="150" y="250" width="200" height="146" fill="url(#b-tank)"/>
  <path d="M150 250 C150 160 350 160 350 250Z" fill="url(#b-dome)"/>
  <path d="M176 222 C196 196 236 186 262 186" stroke="#BBF7D0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g stroke="#94A3B8" stroke-width="3"><path d="M150 290 H350"/><path d="M150 330 H350"/><path d="M150 370 H350"/></g>
  <!-- digester 2 -->
  <rect x="370" y="290" width="120" height="106" fill="url(#b-tank)"/>
  <path d="M370 290 C370 236 490 236 490 290Z" fill="url(#b-dome)"/>
  <g stroke="#94A3B8" stroke-width="3"><path d="M370 330 H490"/><path d="M370 366 H490"/></g>
  <!-- pipe + flare -->
  <path d="M350 270 H560 V200" fill="none" stroke="#475569" stroke-width="10" stroke-linejoin="round"/>
  <path d="M350 270 H560 V200" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round"/>
  <rect x="548" y="186" width="24" height="16" rx="3" fill="#334155"/>
  <path d="M560 186 C540 160 552 136 560 118 C568 136 584 150 572 172 C570 180 566 184 560 186Z" fill="url(#b-flame)"/>
  <!-- power -->
  <g transform="translate(560 300)">
    <rect x="-34" y="0" width="68" height="96" rx="10" fill="#1E293B"/>
    <path d="M4 18 L-12 50 H2 L-6 80 L16 42 H2 L10 18Z" fill="#FACC15"/>
  </g>
  <path d="M594 330 C620 330 630 300 630 270" stroke="#FACC15" stroke-width="4" fill="none" stroke-dasharray="3 8" stroke-linecap="round"/>
  <!-- feed: manure + crop residue -->
  <g transform="translate(40 300)">
    <rect x="0" y="40" width="96" height="56" rx="10" fill="#A16207"/>
    <path d="M6 40 C10 10 86 10 90 40Z" fill="#78350F"/>
    <g fill="#FDE68A"><path d="M20 36 l8 -24 l4 24z"/><path d="M44 30 l6 -26 l6 26z"/><path d="M66 34 l8 -22 l3 22z"/></g>
    <circle cx="20" cy="100" r="10" fill="#334155"/><circle cx="76" cy="100" r="10" fill="#334155"/>
  </g>
  <path d="M140 352 H150" stroke="#65A30D" stroke-width="6" stroke-linecap="round"/>
  <path d="M126 336 C140 330 146 340 150 352" fill="none" stroke="#65A30D" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- bubbles -->
  <g fill="#fff" opacity=".9"><circle cx="230" cy="214" r="6"/><circle cx="252" cy="196" r="4"/><circle cx="276" cy="210" r="5"/><circle cx="430" cy="262" r="4"/></g>
  <text x="250" y="320" font-family="Arial" font-size="20" font-weight="800" fill="#15803D" text-anchor="middle">BIOGAS</text>
  <text x="250" y="344" font-family="Arial" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">CH₄ + CO₂</text>
  <g fill="#fff"><path d="M420 90 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M300 110 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/></g>
</svg>
